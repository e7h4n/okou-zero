name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    name: Native ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    outputs:
      # Both matrix legs configure the same immutable source version.
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake dpkg-dev pkg-config python3 openssl sudo

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Read configured CMake version
        id: version
        shell: bash
        run: |
          version=$(awk -F= '$1 == "CMAKE_PROJECT_VERSION:STATIC" {print $2}' build/CMakeCache.txt)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cmake --build build -j2

      # CMake registers native, UI, and mocked Python updater unit tests.
      # Do not invoke installed updater check/apply here: they use the network.
      - name: Run native, UI, and updater unit tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Exercise binary contract
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./build/okou-zero --version | grep -Fx "Okou $PACKAGE_VERSION"
          timeout 30s ./build/okou-zero --headless --output build/headless.ppm
          timeout 30s ./build/okou-zero --headless --output build/headless-keys.ppm --keys enter,enter,esc

      - name: Build Debian package
        working-directory: build
        run: cpack -G DEB

      - name: Smoke-test installed Debian package
        shell: bash
        run: |
          shopt -s nullglob
          packages=(build/*.deb)
          test "${#packages[@]}" -eq 1
          bash scripts/ci-package-smoke.sh "${packages[0]}" build

      - name: Generate and verify SHA-256 checksums
        working-directory: build
        run: |
          sha256sum -- *.deb *.ppm > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload package, checksums, and renders
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: okou-zero-${{ steps.version.outputs.version }}-${{ matrix.arch }}
          path: |
            build/*.deb
            build/SHA256SUMS
            build/*.ppm
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish signed stable arm64 update
    if: github.event_name == 'push' && github.repository == 'e7h4n/okou-zero' && startsWith(github.ref, 'refs/tags/v')
    # A matrix job succeeds only when BOTH native architectures succeed.
    needs: build-test-package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out trusted tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download this run's tested arm64 package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: okou-zero-${{ needs.build-test-package.outputs.version }}-arm64
          path: release-input

      - name: Install signing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 openssl dpkg-dev

      - name: Validate, sign, verify, and publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          OKOU_UPDATE_SIGNING_KEY: ${{ secrets.OKOU_UPDATE_SIGNING_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          shopt -s nullglob
          packages=(release-input/*.deb)
          test "${#packages[@]}" -eq 1
          python3 scripts/release.py --tag "$RELEASE_TAG" --package "${packages[0]}" --output-dir release-assets
