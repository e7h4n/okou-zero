name: Build and test
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  native:
    name: Native ${{ matrix.arch }} build and tests
    runs-on: ${{ matrix.runner }}
    # Configuration source only; this is the single standard package, not a staging variant.
    environment: staging
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            desktop: 'ON'
            build_type: Debug
          - runner: ubuntu-24.04-arm
            arch: arm64
            desktop: 'OFF'
            build_type: Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ github.ref == 'refs/heads/main' && '0' || '1' }}
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build g++ libcurl4-openssl-dev libssl-dev zlib1g-dev nlohmann-json3-dev libasound2-dev libpulse-dev libsdl2-dev libfreetype-dev fonts-noto-cjk clang-format dpkg-dev python3 openssl sudo
      - name: Check repository hygiene
        if: matrix.arch == 'amd64'
        run: |
          git diff --check
          python3 scripts/check_repository.py
          clang-format --dry-run --Werror include/okou/*.hpp src/*.cpp tests/*.cpp
      - name: Configure native build
        env:
          PUBLIC_CLIENT_ID: ${{ vars.OKOU_ZERO_OAUTH_CLIENT_ID }}
          BUILD_TYPE: ${{ matrix.build_type }}
          BUILD_STORE: ${{ matrix.arch == 'arm64' && 'ON' || 'OFF' }}
          BUILD_DESKTOP: ${{ matrix.desktop }}
          TRUSTED_PUBLISH: ${{ github.event_name == 'push' && github.repository == 'e7h4n/okou-zero' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          # Forks may run offline tests without a configured public client.
          # A trusted main build must never publish an unconfigured package.
          if [[ "$TRUSTED_PUBLISH" == true && -z "$PUBLIC_CLIENT_ID" ]]; then
            echo 'Missing public OKOU_ZERO_OAUTH_CLIENT_ID Variable' >&2
            exit 1
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DOKOU_ZERO_STORE="$BUILD_STORE" -DOKOU_ZERO_DESKTOP="$BUILD_DESKTOP" -DOKOU_ZERO_OAUTH_CLIENT_ID="$PUBLIC_CLIENT_ID"
      - name: Read configured CMake version
        id: version
        shell: bash
        run: |
          version=$(awk -F= '$1 == "CMAKE_PROJECT_VERSION:STATIC" {print $2}' build/CMakeCache.txt)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build
        run: cmake --build build --parallel 2
      # Updater tests mock all release/network operations. Never check/apply a real update in CI.
      - name: Native protocol, UI and updater tests
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Build and inspect store package
        if: matrix.arch == 'arm64'
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        working-directory: build
        shell: bash
        run: |
          cpack -G DEB
          shopt -s nullglob
          packages=(*.deb)
          test "${#packages[@]}" -eq 1
          test "${packages[0]}" = "okou_${{ steps.version.outputs.version }}_arm64.deb"
          test "$(dpkg-deb -f "${packages[0]}" Architecture)" = "$EXPECTED_ARCH"
          dpkg-deb --info "${packages[0]}"
          dpkg-deb --contents "${packages[0]}"
          sha256sum "${packages[0]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Installation, packaged native UI and removal smoke test
        if: matrix.arch == 'arm64'
        run: bash scripts/ci-package-smoke.sh ./build/okou_*_arm64.deb build
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.arch }}-test-evidence
          path: |
            build/ui-*.bmp
            build/ui-*.ppm
            build/Testing/Temporary/LastTest.log
            build/installed-*.ppm
          retention-days: 14
      - name: Upload tested store package
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: okou-${{ steps.version.outputs.version }}-arm64
          path: |
            build/okou_*_arm64.deb
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
  release-please:
    name: Manage release PR and draft release
    if: github.event_name == 'push' && github.repository == 'e7h4n/okou-zero' && github.ref == 'refs/heads/main'
    # Only promote verified main commits into a release PR or draft release.
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      id: ${{ steps.release.outputs.id }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  release:
    name: Publish signed arm64 store package
    if: >-
      github.event_name == 'push' &&
      github.repository == 'e7h4n/okou-zero' &&
      github.ref == 'refs/heads/main' &&
      needs.release-please.outputs.release_created == 'true'
    # The entire dual-native matrix must pass, including installation and UI smoke tests.
    needs: [native, release-please]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tested main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download this run's tested arm64 package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: okou-${{ needs.native.outputs.version }}-arm64
          path: release-input
      - name: Install signing dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 openssl dpkg-dev
      - name: Validate, sign, verify and publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          OKOU_UPDATE_SIGNING_KEY: ${{ secrets.OKOU_UPDATE_SIGNING_KEY }}
          BUILT_VERSION: ${{ needs.native.outputs.version }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_ID: ${{ needs.release-please.outputs.id }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          test "$BUILT_VERSION" = "$RELEASE_VERSION"
          test "$RELEASE_SHA" = "$RELEASE_COMMIT"
          shopt -s nullglob
          packages=(release-input/*.deb)
          test "${#packages[@]}" -eq 1
          (cd release-input && sha256sum --check SHA256SUMS)
          python3 scripts/release.py \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --release-id "$RELEASE_ID" \
            --package "${packages[0]}" \
            --output-dir release-assets
  publish-store:
    name: Submit CardputerZero store PR
    if: >-
      github.event_name == 'push' &&
      github.repository == 'e7h4n/okou-zero' &&
      github.ref == 'refs/heads/main' &&
      needs.release-please.outputs.release_created == 'true'
    needs: [native, release-please, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check store publishing token
        id: token
        env:
          CARDPUTER_PACKAGES_TOKEN: ${{ secrets.CARDPUTER_PACKAGES_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$CARDPUTER_PACKAGES_TOKEN" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping CardputerZero/packages PR because CARDPUTER_PACKAGES_TOKEN secret is not configured."
            if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
              {
                echo "### CardputerZero Store PR Skipped"
                echo ""
                echo "Configure the \`CARDPUTER_PACKAGES_TOKEN\` repository secret (\`@e7h4n\` Classic PAT with \`public_repo\` scope) to enable automatic store update PRs."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out tested main commit
        if: steps.token.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download this run's tested arm64 package
        if: steps.token.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: okou-${{ needs.native.outputs.version }}-arm64
          path: release-input
      - name: Install store publishing dependencies
        if: steps.token.outputs.enabled == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 dpkg-dev
      - name: Open CardputerZero/packages update PR
        if: steps.token.outputs.enabled == 'true'
        env:
          CARDPUTER_PACKAGES_TOKEN: ${{ secrets.CARDPUTER_PACKAGES_TOKEN }}
          RELEASE_GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_ID: ${{ needs.release-please.outputs.id }}
        shell: bash
        run: |
          shopt -s nullglob
          packages=(release-input/*.deb)
          test "${#packages[@]}" -eq 1
          (cd release-input && sha256sum --check SHA256SUMS)
          python3 scripts/publish_store.py \
            --tag "$RELEASE_TAG" \
            --release-id "$RELEASE_ID" \
            --package "${packages[0]}"
