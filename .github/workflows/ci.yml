name: Build and test
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native:
    name: Native ${{ matrix.profile }} ${{ matrix.arch }} protocols, UI and package
    runs-on: ${{ matrix.runner }}
    environment: ${{ matrix.profile }}
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        profile: [production, staging]
        arch: [amd64, arm64]
        include:
          - runner: ubuntu-24.04
            arch: amd64
            desktop: 'ON'
            build_type: Debug
          - runner: ubuntu-24.04-arm
            arch: arm64
            desktop: 'OFF'
            build_type: Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build g++ libcurl4-openssl-dev libssl-dev zlib1g-dev nlohmann-json3-dev libasound2-dev libsdl2-dev libfreetype-dev fonts-noto-cjk clang-format dpkg-dev python3 openssl sudo
      - name: Check repository hygiene
        if: matrix.arch == 'amd64'
        run: |
          git diff --check
          python3 scripts/check_repository.py
          clang-format --dry-run --Werror include/okou/*.hpp src/*.cpp tests/*.cpp
      - name: Configure native build
        env:
          BUILD_PROFILE: ${{ matrix.profile }}
          PUBLIC_CLIENT_ID: ${{ matrix.profile == 'staging' && vars.OKOU_ZERO_OAUTH_CLIENT_ID || '' }}
          BUILD_TYPE: ${{ matrix.build_type }}
          BUILD_DESKTOP: ${{ matrix.desktop }}
        shell: bash
        run: |
          # Forks can run offline tests without accessing an owner's environment variable.
          # A fixture-only staging build is never uploaded as an installable artifact.
          if [[ "$BUILD_PROFILE" == staging && -z "$PUBLIC_CLIENT_ID" ]]; then
            PUBLIC_CLIENT_ID=ci-fixture-public
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DOKOU_ZERO_DESKTOP="$BUILD_DESKTOP" -DOKOU_ZERO_BUILD_PROFILE="$BUILD_PROFILE" \
            -DOKOU_ZERO_OAUTH_CLIENT_ID="$PUBLIC_CLIENT_ID"
      - name: Read configured CMake version
        id: version
        shell: bash
        run: |
          version=$(awk -F= '$1 == "CMAKE_PROJECT_VERSION:STATIC" {print $2}' build/CMakeCache.txt)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build
        run: cmake --build build --parallel 2
      # Updater tests mock all release/network operations. Never check/apply a real update in CI.
      - name: Native protocol, UI and updater tests
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Build and inspect Debian package
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        working-directory: build
        shell: bash
        run: |
          cpack -G DEB
          shopt -s nullglob
          packages=(okou-zero_*.deb)
          test "${#packages[@]}" -eq 1
          test "$(dpkg-deb -f "${packages[0]}" Architecture)" = "$EXPECTED_ARCH"
          dpkg-deb --info "${packages[0]}"
          dpkg-deb --contents "${packages[0]}"
          sha256sum "${packages[0]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Installation, packaged native UI and removal smoke test
        run: bash scripts/ci-package-smoke.sh ./build/okou-zero_*.deb build
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.profile }}-${{ matrix.arch }}-test-evidence
          path: |
            build/ui-*.bmp
            build/ui-*.ppm
            build/Testing/Temporary/LastTest.log
          retention-days: 14
      - name: Publish package artifact
        if: matrix.profile == 'production' || vars.OKOU_ZERO_OAUTH_CLIENT_ID != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: okou-zero-${{ steps.version.outputs.version }}-${{ matrix.arch }}${{ matrix.profile == 'staging' && '-staging' || '' }}
          path: |
            build/okou-zero_*.deb
            build/SHA256SUMS
            build/installed-headless.ppm
            build/installed-update.ppm
          if-no-files-found: error
          retention-days: 30
  release:
    name: Publish signed stable arm64 update
    if: github.event_name == 'push' && github.repository == 'e7h4n/okou-zero' && startsWith(github.ref, 'refs/tags/v')
    # The entire dual-native matrix must pass, including installation and UI smoke tests.
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out trusted tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download this run's tested arm64 package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: okou-zero-${{ needs.native.outputs.version }}-arm64
          path: release-input
      - name: Install signing dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 openssl dpkg-dev
      - name: Validate, sign, verify and publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          OKOU_UPDATE_SIGNING_KEY: ${{ secrets.OKOU_UPDATE_SIGNING_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          shopt -s nullglob
          packages=(release-input/*.deb)
          test "${#packages[@]}" -eq 1
          python3 scripts/release.py --tag "$RELEASE_TAG" --package "${packages[0]}" --output-dir release-assets
